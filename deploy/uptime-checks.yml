name: Uptime checks

# Pings the app's check engine every 5 minutes.
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   PULSE_URL   — the deployed app URL, e.g. https://neondev-pulse.vercel.app
#   CRON_SECRET — same value as CRON_SECRET in the app's environment
# Note: GitHub may delay scheduled runs by a few minutes under load.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: uptime-checks
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger check engine
        env:
          PULSE_URL: ${{ secrets.PULSE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$PULSE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "PULSE_URL / CRON_SECRET not set yet — skipping."
            exit 0
          fi
          curl -fsS --max-time 90 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$PULSE_URL/api/cron/check"
